# This workflow will push and update articles on dev.to each time a new
# commit is pushed to the main branch.
#
# Required secrets:
# - DEVTO_TOKEN: your dev.to API key
# - GH_TOKEN: fine-grained PAT with Contents: Read and write
#             (only needed for the publish job)

name: publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      GIT_COMMITTER_NAME: "a.mehraji"
      GIT_COMMITTER_EMAIL: "a.mehraji75@gmail.com"

    outputs:
      result_summary: ${{ steps.publish_devto.outputs.result_summary }}

    steps:
      - uses: actions/checkout@v7

      - name: Publish articles on dev.to
        id: publish_devto
        uses: sinedied/publish-devto@v2.1.0
        with:
          devto_key: ${{ secrets.DEVTO_TOKEN }}
          github_token: ${{ secrets.GH_TOKEN }}
          files: 'posts/**/*.md'
          branch: main
          conventional_commits: true
          dry_run: false

  comment:
    needs: publish
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Comment PR with publish result
        uses: actions-ecosystem/action-create-comment@v1
        with:
          github_token: ${{ github.token }}
          body: |
            Changes result:
            ```
            ${{ steps.publish_devto.outputs.result_summary }}
            ```
